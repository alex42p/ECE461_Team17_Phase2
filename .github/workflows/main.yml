name: Test Pipeline

on: 
  push:
    branches: [ main ]

jobs:
  build: 
    runs-on: ubuntu-latest

    env: # add necessary environment variables here
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOG_FILE: src/app.log
      LOG_LEVEL: '0'
      # leave these blank - only here to pass tests in GH Actions
      FLASK_SECRET_KEY: ''
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: 'us-east-2'
      S3_BUCKET_NAME: 'team17-model-storage'
      AWS_COGNITO_USER_POOL_ID: ${{ secrets.AWS_COGNITO_USER_POOL_ID }}
      AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
      AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      DYNAMODB_ENDPOINT: 'http://localhost:8000'
      DYNAMOODB_TABLE_PREFIX: ${{ secrets.DYNAMODB_TABLE_PREFIX }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # - name: Run mypy
      #   run: mypy src/

      - name: Run Tests
        run: python -m pytest --cov=src --cov-report=term-missing tests/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # REQUIRED to push back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Important: allows merging full history

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main -> prod
        run: |
          git checkout prod
          git pull origin prod
          git merge origin/main --no-ff -m "Automated merge from main to prod"
          git push origin prod
